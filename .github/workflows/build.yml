name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Install icon tooling
        run: brew install librsvg

      - name: Build app
        env:
          CI: "true"
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          cd .build
          ditto -c -k --keepParent nafi.app "nafi-${VERSION}.zip"
          echo "ARTIFACT=.build/nafi-${VERSION}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: nafi-app
          path: .build/nafi-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .build/nafi-*.zip
          generate_release_notes: true
