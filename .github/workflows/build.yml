name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Install icon tooling
        run: brew install librsvg

      - name: Build app
        env:
          CI: "true"
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          mkdir -p dist
          ditto -c -k --keepParent .build/nafi.app "dist/nafi-${VERSION}.zip"
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: nafi-app
          path: dist/nafi-*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/nafi-*.zip
          generate_release_notes: true
