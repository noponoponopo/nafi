name: build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Install icon tooling
        run: brew install librsvg

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Run unit tests
        run: swift test --parallel

      - name: Build app
        env:
          CI: "true"
        run: ./scripts/build-app.sh

      - name: Package
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          mkdir -p dist
          ditto -c -k --keepParent .build/nafi.app "dist/nafi-${VERSION}.zip"
          ls -la dist/

      - name: Create macOS DMG
        run: |
          VERSION=$(plutil -extract CFBundleShortVersionString raw Info.plist)
          APP_PATH=".build/nafi.app"
          DMG_PATH="dist/nafi-${VERSION}.dmg"

          create-dmg \
            --volname "nafi" \
            --volicon "${APP_PATH}/Contents/Resources/AppIcon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "nafi.app" 150 190 \
            --hide-extension "nafi.app" \
            --app-drop-link 450 185 \
            --no-internet-enable \
            "${DMG_PATH}" \
            "${APP_PATH}" || true

          if [[ ! -f "${DMG_PATH}" ]]; then
            hdiutil create \
              -volname "nafi" \
              -srcfolder "${APP_PATH}" \
              -ov \
              -format UDZO \
              "${DMG_PATH}"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: nafi-app
          path: |
            dist/nafi-*.zip
            dist/nafi-*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: nafi-app
          path: dist

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/nafi-*.zip
            dist/nafi-*.dmg
          generate_release_notes: true
